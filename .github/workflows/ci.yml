name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # CI=false: CRA still runs its build-time ESLint pass and prints
      # warnings, but doesn't promote them to build-breaking errors. This
      # matches local dev (.env sets DISABLE_ESLINT_PLUGIN=true) — with
      # CI=true this step has failed on every run since at least 2026-07-21
      # on a backlog of pre-existing warnings unrelated to whatever changed,
      # which meant the deploy job below (needs: build-and-test) never ran.
      - name: Build (lint + compile)
        run: CI=false npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # E2E suite expects the backend already running on localhost — see
      # e2e/README.md for how to start it. Skipped here until that's wired
      # into this workflow (needs backend secrets as GitHub Actions secrets
      # first — see DEPLOYMENT.md / ask Claude to finish this step).
      # - name: Run E2E tests
      #   run: npx playwright test

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/apps/frontend
            git pull
            # --include=dev: the build needs tailwindcss & co. A shell with NODE_ENV=production would otherwise skip
            # them and the build stops at "react-scripts: not found".
            npm ci --include=dev
            # Build into a side folder and swap it in only once the build has succeeded. A build in place
            # empties the live folder first: the site answers HTTP 500 (no index.html) for the whole build,
            # and stays broken if the build fails. build_prev keeps the previous version for a quick rollback.
            rm -rf build_new
            # GENERATE_SOURCEMAP=false: the .map files would otherwise be served to everyone next to the bundles
            GENERATE_SOURCEMAP=false BUILD_PATH=build_new npm run build
            rm -rf build_prev
            [ -d build ] && mv build build_prev
            mv build_new build
