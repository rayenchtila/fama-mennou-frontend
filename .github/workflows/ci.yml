name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # CRA lints (react-app eslint config) and fails on warnings when CI=true
      - name: Build (lint + compile)
        run: CI=true npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # E2E suite expects the backend already running on localhost — see
      # e2e/README.md for how to start it. Skipped here until that's wired
      # into this workflow (needs backend secrets as GitHub Actions secrets
      # first — see DEPLOYMENT.md / ask Claude to finish this step).
      # - name: Run E2E tests
      #   run: npx playwright test

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/ubuntu/apps/frontend
            git pull
            npm ci
            npm run build
